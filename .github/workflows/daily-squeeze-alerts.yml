name: Daily Squeeze Wave Email Alerts

on:
  schedule:
    - cron: '0 6 * * 2-5'   # 8:00 AM CEST martes-viernes
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas numpy scipy
      - name: Run daily alerts
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}   # Contiene la clave de Massive
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python daily_alerts.py